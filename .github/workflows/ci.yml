name: CI

on:
  push:
    branches: [main]
  pull_request:

# Branches are covered by the pull_request trigger, so pushing to one does not
# also run this workflow against the branch head: same commits, same result,
# twice the runners. A superseded run tells you nothing useful either; stop it
# and keep the latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes anywhere: it checks out code, runs tests, and uploads an
# artefact through the runner rather than the API. Denying everything at the top
# means a job has to name what it needs, and a future job cannot silently
# inherit write access to the repository.
permissions: {}

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step in this job pushes anything, and a token left behind in
          # .git/config is readable by everything that runs afterwards --
          # including whatever the dependency tree brought with it.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The same file `nvm use` reads, so CI and a contributor's checkout
          # cannot drift apart, and the next LTS cutover needs no edit here.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # erasableSyntaxOnly is enforced here: syntax Node cannot strip fails
        # the build rather than only the run.
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Chromium
        # The end-to-end tests drive a real browser, which is the only way to
        # exercise the thing this project actually measures.
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        # A skipped browser suite would otherwise report success and test
        # nothing at all; this makes that a red build.
        env:
          P2P_REQUIRE_BROWSER: '1'
        run: npm run test:e2e

      - name: Upload artefacts from failed runs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p2p-failure
          path: |
            runs/
            /tmp/p2p-*/
          retention-days: 7
          if-no-files-found: ignore

  workflows:
    name: workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        # Hardening that is not enforced decays: the next hand-edited workflow
        # reintroduces a floating tag or a default-permissions job and nobody
        # notices. Pinned so a new zizmor release cannot turn a green build red
        # on its own -- Dependabot proposes that bump like any other.
        # Offline by choice: the online audits want a token, and this job is
        # deliberately not given one.
        run: pipx run zizmor==1.30.1 --persona=auditor --no-online-audits .github/workflows
